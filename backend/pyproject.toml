[project]
name = "currency-tracker-api"
version = "0.1.0"
description = "Exchange rate tracking API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.isort]
# The alembic/ directory sits next to app/, so isort would otherwise treat
# the alembic package itself as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# Depends and Query in a default argument is how FastAPI declares things.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite runs the same whether invoked as pytest or python -m pytest.
pythonpath = ["."]
addopts = "-q"
