[project]
name = "currency-tracker-api"
version = "0.1.0"
description = "Exchange rate tracking API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite runs the same whether invoked as pytest or python -m pytest.
pythonpath = ["."]
addopts = "-q"
